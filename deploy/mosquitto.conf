# Mosquitto config for the patient-monitor appliance (LAN-only bedside device).
# Installed to /etc/mosquitto/conf.d/patient-monitor.conf by setup-pi.sh.
#
# NOTE: only settings NOT already present in the base /etc/mosquitto/mosquitto.conf
# belong here. Debian's base config already sets `persistence` and
# `persistence_location`; redefining them makes mosquitto refuse to start
# ("Duplicate persistence_location value"). So we only add the listener + auth.

listener 1883 0.0.0.0
# LAN appliance on an isolated bedside network — no auth. Do NOT expose to WAN.
allow_anonymous true
